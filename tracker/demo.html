<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyKnowledge · 数据层演示 (N4)</title>
<style>
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1.05rem; margin-top: 1.5rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; margin: .6rem 0; }
  button { padding: .35rem .7rem; cursor: pointer; }
  select, input[type=file] { padding: .3rem; }
  pre { background: #f6f8fa; border: 1px solid #ddd; border-radius: 6px; padding: .7rem; font-size: .85rem; overflow: auto; min-height: 4rem; max-height: 22rem; }
  table { border-collapse: collapse; font-size: .9rem; } td, th { border: 1px solid #ddd; padding: .25rem .6rem; }
  .warn { color: #9a6700; background: #fff8c5; border: 1px solid #e0cc6b; border-radius: 6px; padding: .5rem .7rem; font-size: .85rem; }
</style>
</head>
<body>
<h1>MyKnowledge · tracker 数据层演示页</h1>
<div class="warn">说明: IndexedDB 在部分浏览器对 file:// 不可用 —— 请用静态服务器打开本目录 (npm run demo 或 python3 -m http.server)。本页直接调用 tracker/db.js, 与站点 UI (N5) 解耦。</div>

<h2>1. 记录事件</h2>
<div class="row">
  单元: <select id="unitSel">
    <option value="e-vocab-001">e-vocab-001 高频动词</option>
    <option value="e-vocab-002">e-vocab-002 高频名词</option>
    <option value="e-vocab-003">e-vocab-003 学习话题词</option>
    <option value="e-gram-001">e-gram-001 时态总览</option>
    <option value="e-gram-002">e-gram-002 句子成分</option>
  </select>
  <button onclick="markOpen()">记 unit_open</button>
  <button onclick="toggleComplete()">切换 完成/撤销完成</button>
  <button onclick="showState()">显示全部派生状态</button>
  <button onclick="showRaw()">显示事件日志</button>
</div>

<h2>2. 复原: 导出 / 导入 / 快照</h2>
<div class="row">
  <button onclick="doExport()">导出 JSON (下载)</button>
  <label>导入 JSON: <input type="file" id="importFile" accept="application/json" onchange="doImport(this)"></label>
  <button onclick="doSnapshot()">新建快照</button>
  <button onclick="doSnapshotRestore()">从最近快照恢复</button>
  <button onclick="doClear()">清空事件 (快照保留)</button>
</div>
<div class="row">
  快照列表: <select id="snapSel"></select>
  <button onclick="refreshSnaps()">刷新快照</button>
  <button onclick="doSnapRestoreSelect()">恢复所选快照</button>
</div>

<h2>3. 日志</h2>
<pre id="log"></pre>

<script type="module">
import { openDB, recordEvent, getState, getUnitState, exportData, importData,
         takeSnapshot, listSnapshots, restoreSnapshot, clearEvents } from './db.js'

let db = null
const log = (s) => { const el = document.getElementById('log'); el.textContent += s + '\n'; el.scrollTop = el.scrollHeight }
const unit = () => document.getElementById('unitSel').value

async function init() {
  db = await openDB()
  log('✓ 数据库已打开 (myknowledge v' + 1 + ')')
  await refreshSnaps()
  await showState()
}
init().catch((e) => log('✗ init: ' + e))

window.markOpen = async () => {
  const ev = await recordEvent(db, { type: 'unit_open', unitId: unit(), payload: { via: 'demo' } })
  log('✓ unit_open  ' + ev.unitId + '  @' + ev.ts)
  await showState()
}
window.toggleComplete = async () => {
  const u = unit(); const st = await getUnitState(db, u)
  const done = st.status === 'completed'
  const ev = await recordEvent(db, { type: done ? 'unit_uncomplete' : 'unit_complete', unitId: u, payload: { via: 'demo', prev: st.status } })
  log((done ? '↩ unit_uncomplete ' : '✓ unit_complete ') + ev.unitId)
  await showState()
}
window.showState = async () => {
  const st = await getState(db)
  let html = 'unitId | status | openCount | completedAt\n' + '-'.repeat(60) + '\n'
  for (const [id, s] of [...st.entries()].sort()) {
    html += id + ' | ' + s.status + ' | ' + s.openCount + ' | ' + (s.completedAt ?? '-') + '\n'
  }
  if (st.size === 0) html += '(空)'
  document.getElementById('log').textContent = html + '\n'
}
window.showRaw = async () => {
  const data = await exportData(db)
  log('事件总数: ' + data.eventCount)
  log(JSON.stringify(data.events, null, 1).slice(0, 4000))
}
window.doExport = async () => {
  const data = await exportData(db)
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob); a.download = 'myknowledge-export-' + data.exportedAt.slice(0, 10) + '.json'
  a.click(); URL.revokeObjectURL(a.href)
  log('✓ 已导出 ' + data.eventCount + ' 条事件 → myknowledge-export-....json')
}
window.doImport = async (input) => {
  const f = input.files[0]; if (!f) return
  const data = JSON.parse(await f.text())
  try {
    const r = await importData(db, data)
    log('✓ 导入完成: 写入 ' + r.imported + ' 条, 跳过重复 ' + r.skipped + ' 条')
  } catch (e) { log('✗ 导入被拒绝: ' + e.message) }
  input.value = ''; await showState()
}
window.doSnapshot = async () => {
  const id = await takeSnapshot(db)
  log('✓ 快照已建: ' + id)
  await refreshSnaps()
}
window.refreshSnaps = async () => {
  const sel = document.getElementById('snapSel'); sel.innerHTML = ''
  for (const s of await listSnapshots(db)) {
    const o = document.createElement('option'); o.value = s.id
    o.textContent = s.createdAt + ' (' + s.count + ' 事件)'
    sel.appendChild(o)
  }
  log((await listSnapshots(db)).length + ' 份快照 (环形保留最近 5)')
}
window.doSnapRestoreSelect = async () => {
  const sel = document.getElementById('snapSel')
  if (!sel.value) return log('先选一份快照')
  const r = await restoreSnapshot(db, sel.value)
  log('✓ 恢复快照: 写入 ' + r.imported + ', 跳过 ' + r.skipped); await showState()
}
window.doSnapshotRestore = async () => {
  const snaps = await listSnapshots(db)
  if (!snaps.length) return log('无快照可恢复')
  const r = await restoreSnapshot(db, snaps[0].id)
  log('✓ 已从最近快照恢复: 写入 ' + r.imported + ', 跳过 ' + r.skipped); await showState()
}
window.doClear = async () => {
  if (!confirm('清空全部事件日志? (快照保留, 可随后恢复)')) return
  await clearEvents(db); log('✓ 事件已清空'); await showState(); await refreshSnaps()
}
</script>
</body>
</html>
